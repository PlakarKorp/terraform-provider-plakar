name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  # Acceptance needs a live plakman stack; runs on demand until the
  # self-contained test stack lands (same dependency as the Ansible
  # collection's integration job).
  acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - env:
          TF_ACC: "1"
          PLAKAR_API_URL: ${{ secrets.PLAKAR_API_URL }}
          PLAKAR_API_KEY: ${{ secrets.PLAKAR_API_KEY }}
        run: go test ./internal/... -v -timeout 30m
